# 每次推送到 main：先檢查資料，通過才部署到 GitHub Pages。
# 資料檢查失敗時不會部署，網站維持上一個正常版本。
name: 檢查資料並部署

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查資料（JSON 語法、藥材筆數、id、ref_id、連結、結構圖）
        run: node scripts/validate.mjs
      - name: 搜尋與名稱解析自我測試
        run: node scripts/test_search.mjs > /dev/null

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 只打包網站需要的檔案（不含 docs、scripts、gas）
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data icons structures fonts _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
